name: ESPN Data Pipeline

on:
  push:
    paths:
      - '.github/workflows/espn-access-test.yml'
      - 'scripts/validate_espn_data.py'
      - 'scripts/calculate_victory_points.py'
      - 'scripts/process_season.py'
      - 'scripts/cache_team_logos.py'
  schedule:
    # 12:07 UTC = 7:07 AM CDT; 13:07 UTC = 7:07 AM CST.
    # The Central-time guard below ensures only the 7 AM occurrence processes data.
    - cron: '7 12 * * 3'
    - cron: '7 13 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-espn-data:
    runs-on: ubuntu-latest

    env:
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}

    steps:
      - name: Check Central-time schedule window
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CENTRAL_HOUR="$(TZ=America/Chicago date +%H)"
          echo "Scheduled run Central hour: $CENTRAL_HOUR"
          if [ "$CENTRAL_HOUR" = "07" ]; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/checkout@v4

      - name: Validate ESPN team and matchup data
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        run: python scripts/validate_espn_data.py

      - name: Calculate Week 1 Victory Points audit
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        run: python scripts/calculate_victory_points.py --week 1

      - name: Process finalized season data
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        run: python scripts/process_season.py

      - name: Cache ESPN team logos
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        run: python scripts/cache_team_logos.py

      - name: Commit sanitized dashboard data and logos
        if: steps.schedule_guard.outputs.run_pipeline == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/ assets/team-logos/)" ]; then
            echo "No processed data or logo changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/team-logos/
          git commit -m "Update ESPN Victory Points data and team logos"
          git push
