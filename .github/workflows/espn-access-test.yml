name: ESPN Access Test

on:
  push:
    paths:
      - '.github/workflows/espn-access-test.yml'
      - 'scripts/validate_espn_data.py'
  workflow_dispatch:

jobs:
  validate-espn-data:
    runs-on: ubuntu-latest

    env:
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate ESPN team and matchup data
        run: python scripts/validate_espn_data.py
